description: All Def (formerly All Def Digital) is a YouTube-focused digital content studio founded
  by Russell Simmons that produces unscripted original programming for Gen Z, Millennial, and
  multicultural audiences across comedy, food, hip-hop, and culture. Its owned-and-operated channels
  have amassed 15M+ fans and more than 2 billion video views, and it produces branded content for
  partners including Sprite, Snickers, Hyundai, Lexus, and McDonald's. All Def is a portfolio company
  of a16z, surfaced in the API Evangelist network; as of this enrichment pass it publishes no public
  developer API, documentation, developer portal, or SDKs.
